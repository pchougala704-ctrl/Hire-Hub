{% extends "base.html" %}
{% block title %}Your profile{% endblock %}
{% block content %}
<section class="container py-5"><div class="row g-4"><div class="col-lg-4"><span class="eyebrow">Candidate profile</span><h1 class="fw-bold mt-2">Tell your story</h1><p class="text-secondary">A complete profile helps recruiters understand what you bring and improves your job matches.</p><a class="btn btn-outline-dark" href="{{ url_for('web.resume') }}">Manage resume</a></div><div class="col-lg-8"><form method="post" class="card"><div class="card-body p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" value="{{ user.name }}" required></div><div class="col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" value="{{ user.phone }}"></div><div class="col-md-6"><label class="form-label" for="location">Location</label><input class="form-control" id="location" name="location" value="{{ candidate.location or '' }}"></div><div class="col-md-6"><label class="form-label" for="skills">Skills</label><input class="form-control" id="skills" name="skills" value="{{ candidate.skills|join(', ') }}" placeholder="Python, SQL, design"></div><div class="col-12"><label class="form-label" for="education">Education</label><textarea class="form-control" id="education" name="education" rows="2">{{ candidate.education or '' }}</textarea></div><div class="col-12"><label class="form-label" for="experience">Experience details</label><textarea class="form-control" id="experience" name="experience" rows="3">{{ candidate.experience or '' }}</textarea></div><div class="col-md-6"><label class="form-label" for="experience_years">Years of experience</label><input class="form-control" id="experience_years" name="experience_years" type="number" min="0" value="{{ candidate.experience_years if candidate.experience_years is not none else '' }}"></div><div class="col-md-6"><label class="form-label" for="expected_salary">Expected salary</label><input class="form-control" id="expected_salary" name="expected_salary" type="number" min="0" value="{{ candidate.expected_salary or '' }}"></div><div class="col-md-6"><label class="form-label" for="notice_period">Notice period</label><input class="form-control" id="notice_period" name="notice_period" value="{{ candidate.notice_period or '' }}"></div><div class="col-md-6"><label class="form-label" for="preferred_work_mode">Preferred work mode</label><select class="form-select" id="preferred_work_mode" name="preferred_work_mode"><option value="">No preference</option>{% for mode in ['REMOTE','HYBRID','ONSITE'] %}<option value="{{ mode }}" {% if candidate.preferred_work_mode == mode %}selected{% endif %}>{{ mode|title }}</option>{% endfor %}</select></div></div><button class="btn btn-dark mt-4" type="submit">Save profile</button></div></form></div></div></section>
{% endblock %}
