{% extends "base.html" %}
{% block title %}Post a job{% endblock %}
{% block content %}
<section class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><span class="eyebrow">Recruiter workspace</span><h1 class="fw-bold mt-2">{{ 'Edit role' if job else 'Post a new role' }}</h1><p class="text-secondary">Help candidates understand the opportunity, team, and skills you need.</p><form method="post" class="card"><div class="card-body p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-12"><label class="form-label" for="title">Job title</label><input class="form-control" id="title" name="title" value="{{ job.title if job else '' }}" required></div><div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="6" required>{{ job.description if job else '' }}</textarea></div><div class="col-md-6"><label class="form-label" for="skills">Skills (comma separated)</label><input class="form-control" id="skills" name="skills" value="{{ job.skills|join(', ') if job else '' }}"></div><div class="col-md-6"><label class="form-label" for="location">Location</label><input class="form-control" id="location" name="location" value="{{ job.location if job else '' }}"></div><div class="col-md-6"><label class="form-label" for="work_mode">Work mode</label><select class="form-select" id="work_mode" name="work_mode">{% for value in ['ONSITE','HYBRID','REMOTE'] %}<option value="{{ value }}" {% if job and job.work_mode == value %}selected{% endif %}>{{ value|title }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label" for="employment_type">Employment type</label><select class="form-select" id="employment_type" name="employment_type">{% for value in ['FULL_TIME','PART_TIME','INTERNSHIP','CONTRACT'] %}<option value="{{ value }}" {% if job and job.employment_type == value %}selected{% endif %}>{{ value|replace('_',' ')|title }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label" for="salary_min">Salary minimum</label><input class="form-control" id="salary_min" name="salary_min" type="number" min="0" value="{{ job.salary_min if job and job.salary_min is not none else '' }}"></div><div class="col-md-6"><label class="form-label" for="salary_max">Salary maximum</label><input class="form-control" id="salary_max" name="salary_max" type="number" min="0" value="{{ job.salary_max if job and job.salary_max is not none else '' }}"></div><div class="col-md-6"><label class="form-label" for="experience_min">Minimum experience (years)</label><input class="form-control" id="experience_min" name="experience_min" type="number" min="0" value="{{ job.experience_min if job and job.experience_min is not none else '' }}"></div><div class="col-md-6"><label class="form-label" for="experience_max">Maximum experience (years)</label><input class="form-control" id="experience_max" name="experience_max" type="number" min="0" value="{{ job.experience_max if job and job.experience_max is not none else '' }}"></div><div class="col-md-6"><label class="form-label" for="deadline">Application deadline</label><input class="form-control" id="deadline" name="deadline" type="date" value="{{ job.deadline if job else '' }}"></div></div><button class="btn btn-dark mt-4" type="submit">{{ 'Save changes' if job else 'Publish job' }}</button></div></form></div></div></section>
{% endblock %}
