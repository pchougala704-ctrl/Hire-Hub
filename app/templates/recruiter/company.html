{% extends "base.html" %}
{% block title %}Company profile{% endblock %}
{% block content %}
<section class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><span class="eyebrow">Recruiter workspace</span><h1 class="fw-bold mt-2">Company profile</h1><p class="text-secondary">Share information candidates need to know about your organization.</p><form method="post" class="card"><div class="card-body p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">Company name</label><input class="form-control" id="name" name="name" value="{{ company.name if company else '' }}" required></div><div class="mb-3"><label class="form-label" for="description">About your company</label><textarea class="form-control" id="description" name="description" rows="4">{{ company.description if company else '' }}</textarea></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="location">Location</label><input class="form-control" id="location" name="location" value="{{ company.location if company else '' }}"></div><div class="col-md-6"><label class="form-label" for="website">Website</label><input class="form-control" id="website" name="website" type="url" value="{{ company.website if company else '' }}" placeholder="https://example.com"></div></div><p class="small text-secondary mt-3">Verification: {{ 'Verified' if company and company.verified else 'Pending' }}</p><button class="btn btn-dark mt-2" type="submit">Save company</button></div></form></div></div></section>
{% endblock %}
