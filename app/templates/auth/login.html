{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="container auth-wrap py-5"><div class="card auth-card mx-auto"><div class="card-body p-4 p-md-5">
  <span class="eyebrow">Welcome back</span><h1 class="h2 fw-bold mt-2">Sign in to HireHub</h1><p class="text-secondary">Continue your search or manage your team.</p>
  <form method="post" class="mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-dark w-100 py-2 mt-2" type="submit">Sign in</button>
  </form><p class="mt-4 mb-0 text-secondary">New to HireHub? <a href="{{ url_for('web_auth.register') }}">Create an account</a></p><p class="small mt-2 mb-0"><a href="{{ url_for('web_auth.admin_login') }}">Administrator sign in</a></p>
</div></div></section>
{% endblock %}
