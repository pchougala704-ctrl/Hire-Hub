{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="container auth-wrap py-5"><div class="card auth-card mx-auto"><div class="card-body p-4 p-md-5">
  <span class="eyebrow">Get started</span><h1 class="h2 fw-bold mt-2">Create your account</h1><p class="text-secondary">Join candidates and teams finding their next great match.</p>
  <form method="post" class="mt-4" id="register-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="role">I am a</label><select class="form-select" id="role" name="role"><option value="CANDIDATE">Candidate</option><option value="RECRUITER">Recruiter</option></select></div>
    <div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" autocomplete="name" required minlength="2"></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="mb-3"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" type="tel" autocomplete="tel"></div>
    <div class="mb-3 recruiter-company d-none"><label class="form-label" for="company_name">Company name</label><input class="form-control" id="company_name" name="company_name"></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required minlength="8"></div>
    <div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8"></div>
    <button class="btn btn-dark w-100 py-2 mt-2" type="submit">Create account</button>
  </form><p class="mt-4 mb-0 text-secondary">Already have an account? <a href="{{ url_for('web_auth.login') }}">Sign in</a></p>
</div></div></section>
{% endblock %}
